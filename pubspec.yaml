name: js_widget_runtime
description: Run JavaScript widgets as Flutter widgets using QuickJS (VM) or Web Workers (web).
version: 0.4.209
homepage: https://github.com/IstiN/flutter_js_widget_runtime
documentation: https://github.com/IstiN/flutter_js_widget_runtime/tree/main

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_js: ^0.8.7
  # QuickJS FFI backend (default VM backend): QuickJS + C bridge via Native
  # Assets with synchronous host callbacks and zero-copy binary lane.
  quickjs_runtime: ^0.4.9
  web: ^1.1.1
  flutter_svg: ^2.4.0
  flutter_markdown_plus: ^1.0.7
  fl_chart: ^1.2.0
  path: ^1.9.1
  path_provider: ^2.1.3

  # Map node renderer (OSM tiles, no API key).
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # 3D scene hosts (scene3d node): flutter_cube for procedural primitives and
  # OBJ models (cross-platform), vendored flame_3d (lib/src/flame_3d_vendor)
  # for GLB/GLTF with PBR materials — see VENDOR.md there for why it is
  # vendored (hosted 0.3.0 does not compile on Flutter 3.47+).
  flutter_cube: ^0.1.1
  flame: ^1.38.0
  flutter_gpu:
    sdk: flutter
  vector_math: ^2.1.4

  # Transitive deps of the vendored flame_3d copy (declared explicitly
  # because the vendored sources import them directly).
  collection: ^1.19.1
  meta: ^1.12.0
  ordered_set: ^8.0.0

  # Conditional platform helpers; imported only on web.
  # shared_preferences is used by the web engine for storage fallback.
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
  crap4dart: ^0.30.0
  # F3a Android: compiles the angle1b device suite (test/angle1b/
  # e2e_android_*_test.dart) in the host test run, where the tests are
  # skipped outside Android.
  # F3b iOS (issue #7 AC3): the e2e_ios device suite (test/angle1b/
  # e2e_ios_scene_test.dart) is an integration_test run on an iOS device or
  # simulator; off-iOS hosts compile it and self-skip. Dev-only — the main
  # library never imports it.
  integration_test:
    sdk: flutter
  # Dev-only: lets `flutter test packages/jsr_three_angle/test` compile the
  # opt-in 1B package tests from the repository root (CI job quality-macos).
  # The main library never imports it (ADR-0003 decision 1).
  jsr_three_angle:
    path: packages/jsr_three_angle

# vector_graphics_compiler still caps xml at <=7.0.1, while current crap4dart
# requires ^7.1.0. The 7.1 API is backward-compatible; SVG tests guard this
# root-only override (dependency overrides do not propagate to consumers).
dependency_overrides:
  xml: ^7.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/three/
    - assets/flame_3d/shaders/
    - test/assets/
