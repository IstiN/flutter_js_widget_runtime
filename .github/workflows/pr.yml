name: PR Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Install dependencies
        run: flutter pub get

      - name: Build QuickJS bridge
        run: |
          set -euo pipefail
          QUICKJS_SRC=$(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 1 -type d -name 'quickjs_runtime-*' | sort -V | tail -1)
          test -n "$QUICKJS_SRC"
          bash "$QUICKJS_SRC/tool/build_quickjs.sh"
          mkdir -p native/quickjs
          cp "$QUICKJS_SRC/native/quickjs/libquickjs_bridge.so" native/quickjs/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify pinned THREE bundles and official example
        run: |
          set -euo pipefail
          THREE_COMMIT=$(python3 -c "import json; print(json.load(open('tool/three/source-pin.json'))['commit'])")
          git clone --filter=blob:none --no-checkout https://github.com/mrdoob/three.js.git /tmp/jsr-three-r186
          git -C /tmp/jsr-three-r186 checkout "$THREE_COMMIT"
          npm ci --prefix tool/three
          node tool/three/build.mjs --source /tmp/jsr-three-r186 --verify
          npm --prefix tool/three test
          dart run bin/jsr_three_example.dart prepare webgl_geometry_minecraft --source /tmp/jsr-three-r186 --offline --verify
          node tool/three_example/test/prepare_test.mjs

      - name: Run tests with coverage
        run: flutter test --coverage --no-pub

      - name: Run real-Worker WebGL2 tests
        run: flutter test --platform chrome test/web_three_host_web_test.dart --no-pub

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Exclude platform-specific code from coverage
        run: |
          lcov --remove coverage/lcov.info \
            'lib/src/flame_3d_vendor/**' \
            'lib/src/runtime/js_widget_engine_flutter_js.dart' \
            'lib/src/runtime/js_widget_engine_web_worker.dart' \
            'lib/src/widgets/js_widget_app.dart' \
            'lib/src/widgets/js_widget_demo_menu.dart' \
            'lib/src/widgets/js_widget_runtime_widget.dart' \
            --ignore-errors unused --ignore-errors empty \
            -o coverage/lcov.info

      - name: File size guard
        env:
          MAX_LINES: '1500'
        run: |
          set -euo pipefail
          VIOLATIONS=()
          while IFS= read -r file; do
            case "$file" in
              *.dart)
                case "$file" in
                  *.g.dart|*.freezed.dart|*.mocks.dart) continue ;;
                esac
                lines=$(wc -l < "$file")
                if (( lines > MAX_LINES )); then
                  VIOLATIONS+=("  $file: $lines lines (max $MAX_LINES)")
                fi
                ;;
            esac
          done < <(find lib test -type f)
          if ((${#VIOLATIONS[@]} > 0)); then
            echo "❌ QUALITY GATE FAILED — FILE SIZE"
            printf '%s\n' "${VIOLATIONS[@]}"
            exit 1
          fi
          echo "✅ File size guard OK (max $MAX_LINES lines)"

      - name: Code duplication guard
        env:
          DUP_THRESHOLD: '1.0'
        run: |
          set -euo pipefail
          npm install -g jscpd >/dev/null 2>&1 || true
          jscpd --config .jscpd.json --min-tokens 50 --min-lines 5 --reporters json --output /tmp/jscpd-ci lib/ test/ >/dev/null 2>&1 || true
          DUP_PCT=$(python3 scripts/compute_duplication.py /tmp/jscpd-ci/jscpd-report.json)
          if python3 -c "exit(0 if float('$DUP_PCT') < float('$DUP_THRESHOLD') else 1)"; then
            echo "✅ Duplication check OK ($DUP_PCT% < ${DUP_THRESHOLD}%)"
          else
            echo "❌ QUALITY GATE FAILED — CODE DUPLICATION"
            echo "   Duplication: $DUP_PCT% (max ${DUP_THRESHOLD}%)"
            exit 1
          fi

      - name: Coverage ratchet
        env:
          COVERAGE_BASELINE: '80.0'
          COVERAGE_TARGET: '80.0'
        run: |
          set -euo pipefail
          COVERAGE_PCT=$(python3 scripts/compute_coverage.py coverage/lcov.info)
          if python3 -c "exit(0 if float('$COVERAGE_PCT') >= float('$COVERAGE_BASELINE') else 1)"; then
            echo "✅ Coverage ratchet OK ($COVERAGE_PCT% >= ${COVERAGE_BASELINE}%)"
            if python3 -c "exit(0 if float('$COVERAGE_PCT') >= float('$COVERAGE_TARGET') else 1)"; then
              echo "🏆 Coverage target ${COVERAGE_TARGET}% reached — excellent!"
            else
              echo "🎯 Coverage target: ${COVERAGE_TARGET}% (current: $COVERAGE_PCT%)"
            fi
          else
            echo "❌ QUALITY GATE FAILED — TEST COVERAGE"
            echo "   Coverage: $COVERAGE_PCT% (baseline ${COVERAGE_BASELINE}%)"
            exit 1
          fi

      - name: CRAP ratchet
        run: dart run crap4dart analyze
