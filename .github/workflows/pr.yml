name: PR Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Install dependencies
        run: flutter pub get

      - name: Build QuickJS bridge
        run: |
          set -euo pipefail
          QUICKJS_SRC=$(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 1 -type d -name 'quickjs_runtime-*' | sort -V | tail -1)
          test -n "$QUICKJS_SRC"
          bash "$QUICKJS_SRC/tool/build_quickjs.sh"
          mkdir -p native/quickjs
          cp "$QUICKJS_SRC/native/quickjs/libquickjs_bridge.so" native/quickjs/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify pinned THREE bundles and official example
        run: |
          set -euo pipefail
          THREE_COMMIT=$(python3 -c "import json; print(json.load(open('tool/three/source-pin.json'))['commit'])")
          git clone --filter=blob:none --no-checkout https://github.com/mrdoob/three.js.git /tmp/jsr-three-r186
          git -C /tmp/jsr-three-r186 checkout "$THREE_COMMIT"
          npm ci --prefix tool/three
          node tool/three/build.mjs --source /tmp/jsr-three-r186 --verify
          npm --prefix tool/three test
          dart run bin/jsr_three_example.dart prepare webgl_geometry_minecraft --source /tmp/jsr-three-r186 --offline --verify
          node tool/three_example/test/prepare_test.mjs

      - name: Run tests with coverage
        run: flutter test --coverage --no-pub

      - name: Run real-Worker WebGL2 tests
        run: flutter test --platform chrome test/web_three_host_web_test.dart --no-pub

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Exclude platform-specific code from coverage
        run: |
          lcov --remove coverage/lcov.info \
            'lib/src/flame_3d_vendor/**' \
            'lib/src/runtime/js_widget_engine_flutter_js.dart' \
            'lib/src/runtime/js_widget_engine_web_worker.dart' \
            'lib/src/widgets/js_widget_app.dart' \
            'lib/src/widgets/js_widget_demo_menu.dart' \
            'lib/src/widgets/js_widget_runtime_widget.dart' \
            --ignore-errors unused --ignore-errors empty \
            -o coverage/lcov.info

      - name: File size guard
        env:
          MAX_LINES: '1500'
        run: |
          set -euo pipefail
          VIOLATIONS=()
          while IFS= read -r file; do
            case "$file" in
              *.dart)
                case "$file" in
                  *.g.dart|*.freezed.dart|*.mocks.dart) continue ;;
                esac
                lines=$(wc -l < "$file")
                if (( lines > MAX_LINES )); then
                  VIOLATIONS+=("  $file: $lines lines (max $MAX_LINES)")
                fi
                ;;
            esac
          done < <(find lib test -type f)
          if ((${#VIOLATIONS[@]} > 0)); then
            echo "❌ QUALITY GATE FAILED — FILE SIZE"
            printf '%s\n' "${VIOLATIONS[@]}"
            exit 1
          fi
          echo "✅ File size guard OK (max $MAX_LINES lines)"

      - name: Code duplication guard
        env:
          DUP_THRESHOLD: '1.0'
        run: |
          set -euo pipefail
          npm install -g jscpd@5.4.2 >/dev/null 2>&1 || true
          jscpd --config .jscpd.json --min-tokens 50 --min-lines 5 --reporters json --output /tmp/jscpd-ci lib/ test/ >/dev/null 2>&1 || true
          DUP_PCT=$(python3 scripts/compute_duplication.py /tmp/jscpd-ci/jscpd-report.json)
          if python3 -c "exit(0 if float('$DUP_PCT') < float('$DUP_THRESHOLD') else 1)"; then
            echo "✅ Duplication check OK ($DUP_PCT% < ${DUP_THRESHOLD}%)"
          else
            echo "❌ QUALITY GATE FAILED — CODE DUPLICATION"
            echo "   Duplication: $DUP_PCT% (max ${DUP_THRESHOLD}%)"
            exit 1
          fi

      - name: Coverage ratchet
        env:
          COVERAGE_BASELINE: '80.0'
          COVERAGE_TARGET: '80.0'
        run: |
          set -euo pipefail
          COVERAGE_PCT=$(python3 scripts/compute_coverage.py coverage/lcov.info)
          if python3 -c "exit(0 if float('$COVERAGE_PCT') >= float('$COVERAGE_BASELINE') else 1)"; then
            echo "✅ Coverage ratchet OK ($COVERAGE_PCT% >= ${COVERAGE_BASELINE}%)"
            if python3 -c "exit(0 if float('$COVERAGE_PCT') >= float('$COVERAGE_TARGET') else 1)"; then
              echo "🏆 Coverage target ${COVERAGE_TARGET}% reached — excellent!"
            else
              echo "🎯 Coverage target: ${COVERAGE_TARGET}% (current: $COVERAGE_PCT%)"
            fi
          else
            echo "❌ QUALITY GATE FAILED — TEST COVERAGE"
            echo "   Coverage: $COVERAGE_PCT% (baseline ${COVERAGE_BASELINE}%)"
            exit 1
          fi

      - name: Install crap4dart
        run: dart pub global activate crap4dart '>=0.30.0 <0.31.0'

      - name: CRAP ratchet
        run: crap4dart analyze

      - name: Similarity gate
        run: crap4dart check --only similarity --config crap4dart.yaml

  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Install dependencies
        run: flutter pub get

      - name: Build QuickJS bridge
        run: |
          set -euo pipefail
          QUICKJS_SRC=$(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 1 -type d -name 'quickjs_runtime-*' | sort -V | tail -1)
          test -n "$QUICKJS_SRC"
          bash "$QUICKJS_SRC/tool/build_quickjs.sh"
          mkdir -p native/quickjs
          cp "$QUICKJS_SRC/native/quickjs/libquickjs_bridge.so" native/quickjs/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch conformance pins
        run: |
          set -euo pipefail
          scripts/fetch-conformance.sh
          test -f .conformance/js_widget_runtime/docs/conformance/PROTOCOL.md
          test -f .conformance/js_widget_runtime/harness/harness.mjs

      - name: Run conformance kit
        run: dart run tool/conformance/run_conformance.dart --fixtures .conformance/js_widget_runtime/docs/conformance/fixtures --out build/conformance

      # The pinned harness compare exits 0 even with zero result files
      # (kit-side defect, fixed in wave D), so the count is checked here.
      - name: Verify result count
        run: |
          set -euo pipefail
          expected=$(find .conformance/js_widget_runtime/docs/conformance/fixtures -mindepth 1 -maxdepth 1 -type d -exec test -f {}/expected.json ';' -print | wc -l)
          actual=$(find build/conformance -name '*.result.json' | wc -l)
          echo "conformance: $actual result files for $expected fixtures"
          if [ "$actual" -lt "$expected" ]; then
            echo "::error::missing conformance results ($actual/$expected)"
            exit 1
          fi

      - name: Compare against the contract
        run: node .conformance/js_widget_runtime/harness/harness.mjs compare --fixtures .conformance/js_widget_runtime/docs/conformance/fixtures --results build/conformance --out-report conformance-report.md --out-badge badges/conformance.json

      - name: Upload conformance results
        uses: actions/upload-artifact@v4
        with:
          name: conformance-flutter
          path: build/conformance/*.result.json

      - name: Upload conformance report
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: |
            conformance-report.md
            badges/conformance.json

  quality-macos:
    # Issue #7 (F2): the pinned ANGLE 1B build on macOS + the real-ANGLE
    # host tests. The ANGLE dylibs are cached on the pin hash; the first
    # build is long, later runs restore the cache.
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Install dependencies
        run: flutter pub get

      - name: Build QuickJS bridge
        run: |
          set -euo pipefail
          QUICKJS_SRC=$(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 1 -type d -name 'quickjs_runtime-*' | sort -V | tail -1)
          test -n "$QUICKJS_SRC"
          bash "$QUICKJS_SRC/tool/build_quickjs.sh"
          mkdir -p native/quickjs
          cp "$QUICKJS_SRC/native/quickjs/libquickjs_bridge.so" native/quickjs/

      - name: Metal toolchain
        run: |
          # macos-15 images ship Xcode 16 with the Metal toolchain embedded;
          # the download only runs when the compiler is actually missing
          # (same gate as tool/build_angle.sh).
          if xcrun -f metal >/dev/null 2>&1; then
            echo "Metal toolchain already present"
          else
            xcodebuild -downloadComponent metalToolchain
          fi

      - name: Restore pinned ANGLE build
        id: angle-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/jsr_three_angle/native/angle/out/macos-arm64
          key: angle-macos-arm64-${{ hashFiles('tool/three/pins/angle_pin.json') }}

      - name: Build pinned ANGLE (macos-arm64)
        if: steps.angle-cache.outputs.cache-hit != 'true'
        run: bash tool/build_angle.sh --platform macos-arm64 --out packages/jsr_three_angle/native/angle/out/macos-arm64

      # Save immediately after the build (not in a job-end post step):
      # a failing test step must not throw the ~50-minute ANGLE build away.
      # continue-on-error guards the race with a parallel run saving the
      # same key.
      - name: Save pinned ANGLE build
        if: steps.angle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: packages/jsr_three_angle/native/angle/out/macos-arm64
          key: angle-macos-arm64-${{ hashFiles('tool/three/pins/angle_pin.json') }}

      - name: Build the 1B shim and stage it with the ANGLE dylibs
        run: |
          set -euo pipefail
          OUT=packages/jsr_three_angle/native/angle/out/macos-arm64
          bash packages/jsr_three_angle/native/angle/build.sh
          cp packages/jsr_three_angle/native/angle/libangle_1b.dylib "$OUT/"
          (cd "$OUT" && shasum -a 256 libEGL.dylib libGLESv2.dylib libangle_1b.dylib > SHA256SUMS)

      # The dylibs are the deliverable of BUILD-ANGLE-1: upload them before
      # the tests so a test failure still leaves the artifact for download.
      - name: Upload ANGLE macos-arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: angle-macos-arm64
          path: |
            packages/jsr_three_angle/native/angle/out/macos-arm64/libEGL.dylib
            packages/jsr_three_angle/native/angle/out/macos-arm64/libGLESv2.dylib
            packages/jsr_three_angle/native/angle/out/macos-arm64/libangle_1b.dylib
            packages/jsr_three_angle/native/angle/out/macos-arm64/SHA256SUMS

      - name: jsr_three_angle host tests (real ANGLE)
        env:
          JSR_ANGLE_1B_LIB: ${{ github.workspace }}/packages/jsr_three_angle/native/angle/out/macos-arm64/libangle_1b.dylib
          JSR_REQUIRE_ANGLE: '1'
        run: flutter test packages/jsr_three_angle/test --no-pub

      - name: 1B selection and policy tests
        run: flutter test test/angle1b --no-pub

      - name: 1B batch bench (PERF-1 PERF-2)
        env:
          JSR_ANGLE_1B_LIB: ${{ github.workspace }}/packages/jsr_three_angle/native/angle/out/macos-arm64/libangle_1b.dylib
        run: dart run tool/three/bench_1b.dart

      - name: M3 render gate (compare_1b_render.sh)
        run: bash tool/three/compare_1b_render.sh

      - name: Starter corpus (E2E-EXAMPLES REG-VISUAL-1 E2E-WEB)
        run: bash tool/three/corpus_1b.sh

  angle-size:
    # Issue #7 AC10 size report for every platform built so far. F2d covers
    # macos-arm64 (stripped size, architectures, SHA256 from the
    # quality-macos artifact); the Android/iOS reports and the installed /
    # compressed budget gates land with the F3 platform hosts.
    needs: quality-macos
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ANGLE macos-arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: angle-macos-arm64
          path: angle-artifact

      - name: Size report (macos-arm64)
        run: |
          set -euo pipefail
          cd angle-artifact
          echo "== ANGLE macos-arm64 size report =="
          total_raw=0; total_stripped=0
          for f in libEGL.dylib libGLESv2.dylib libangle_1b.dylib; do
            test -f "$f"
            cp "$f" /tmp/jsr-strip.dylib
            before=$(stat -f %z "$f"); total_raw=$((total_raw+before))
            strip -x /tmp/jsr-strip.dylib
            after=$(stat -f %z /tmp/jsr-strip.dylib); total_stripped=$((total_stripped+after))
            archs=$(lipo -info "$f" | sed -e 's/Architectures in the fat file: //' -e 's/Architectures in this file: //')
            sha=$(shasum -a 256 "$f" | cut -d' ' -f1)
            printf '%-18s raw=%8d stripped=%8d arch=%-10s sha256=%s\n' "$f" "$before" "$after" "$archs" "$sha"
          done
          echo "TOTAL(macos-arm64) raw=$total_raw stripped=$total_stripped"
          # artifact integrity: the hashes recorded by the build job
          shasum -a 256 -c SHA256SUMS
          echo "== ANGLE macos-arm64 size report: OK =="

  # ---------------------------------------------------------------------------
  # F3b iOS (issue #7 AC3 + SIZE-IOS-1 + REG-NOWEBVIEW-1) — everything below
  # belongs to the iOS lane; the Android lane owns angle-android, the shared
  # jobs above are untouched.
  # ---------------------------------------------------------------------------
  angle-ios:
    # The pinned ANGLE Metal build for ios-arm64, the iOS example app with
    # the angle_1b texture plugin (SIZE-IOS-1), and a bounded, recorded
    # simulator attempt of the e2e_ios device suite. ANGLE is cached on the
    # pin hash (same policy as quality-macos).
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Metal toolchain
        run: |
          if xcrun -f metal >/dev/null 2>&1; then
            echo "Metal toolchain already present"
          else
            xcodebuild -downloadComponent metalToolchain
          fi

      - name: Restore pinned ANGLE build (ios-arm64)
        id: angle-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/jsr_three_angle/native/angle/out/ios-arm64
          key: angle-ios-arm64-${{ hashFiles('tool/three/pins/angle_pin.json') }}

      - name: Build pinned ANGLE (ios-arm64)
        if: steps.angle-cache.outputs.cache-hit != 'true'
        run: bash tool/build_angle.sh --platform ios-arm64 --out packages/jsr_three_angle/native/angle/out/ios-arm64

      # The shim is not worth caching (10 s, deterministic); it appends
      # itself to the SHA256SUMS the ANGLE build wrote (REG-SUPPLY-1).
      - name: Build the 1B shim for ios-arm64 and stage it
        run: |
          set -euo pipefail
          OUT=packages/jsr_three_angle/native/angle/out/ios-arm64
          if [ ! -f "$OUT/libangle_1b.dylib" ]; then
            bash packages/jsr_three_angle/native/angle/build_ios.sh "$OUT"
          fi
          test -f "$OUT/libEGL.dylib"

      - name: Save pinned ANGLE build (ios-arm64)
        if: steps.angle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: packages/jsr_three_angle/native/angle/out/ios-arm64
          key: angle-ios-arm64-${{ hashFiles('tool/three/pins/angle_pin.json') }}

      - name: Upload ANGLE ios-arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: angle-ios-arm64
          path: |
            packages/jsr_three_angle/native/angle/out/ios-arm64/libEGL.dylib
            packages/jsr_three_angle/native/angle/out/ios-arm64/libGLESv2.dylib
            packages/jsr_three_angle/native/angle/out/ios-arm64/libangle_1b.dylib
            packages/jsr_three_angle/native/angle/out/ios-arm64/SHA256SUMS

      - name: SIZE-IOS-1 size report (ios-arm64)
        run: |
          set -euo pipefail
          python3 - packages/jsr_three_angle/native/angle/out/ios-arm64 <<'PY' | tee ios-size-report.txt
          import gzip, os, re, subprocess, sys
          out = sys.argv[1]
          mib = 1024 * 1024
          total_stripped = 0
          total_gzip = 0
          failures = []
          print('== ANGLE ios-arm64 size report (SIZE-IOS-1) ==')
          for name in ('libEGL.dylib', 'libGLESv2.dylib', 'libangle_1b.dylib'):
              path = os.path.join(out, name)
              if not os.path.isfile(path):
                  print(f'::error::missing staged library {name}')
                  sys.exit(1)
              raw = os.path.getsize(path)
              stripped_path = f'/tmp/jsr-ios-{name}'
              with open(path, 'rb') as src, open(stripped_path, 'wb') as dst:
                  dst.write(src.read())
              subprocess.run(['strip', '-x', stripped_path], check=True)
              stripped = os.path.getsize(stripped_path)
              gz = len(gzip.compress(open(stripped_path, 'rb').read(), 9))
              total_stripped += stripped
              total_gzip += gz
              lipo = subprocess.run(['lipo', '-info', path], capture_output=True, text=True)
              arch_clean = (lipo.stdout.strip() or lipo.stderr.strip()).split(': ')[-1]
              otool = subprocess.run(['otool', '-l', path], capture_output=True, text=True).stdout
              segs = re.findall(
                  r'cmd LC_SEGMENT_64\s+cmdsize \d+\s+segname (\S+)'
                  r'\s+vmaddr (0x[0-9a-f]+)\s+vmsize (0x[0-9a-f]+)'
                  r'\s+fileoff (\d+)\s+filesize (\d+)', otool)
              misaligned = []
              for s, va, vs, fo, fs in segs:
                  # 16 KiB rule for arm64: vmaddr and fileoff must be 16 KiB
                  # multiples; vmsize must be page-rounded except the trailing
                  # __LINKEDIT (its raw unpadded vmsize is the Mach-O norm —
                  # Apple's own dylibs carry it).
                  if (int(va, 16) % 16384 or int(fo) % 16384
                          or (s != '__LINKEDIT' and int(vs, 16) % 16384)):
                      misaligned.append(s)
              if misaligned:
                  failures.append(f'{name}: 16 KiB misaligned segments {misaligned}')
              probe = arch_clean.lower()
              if 'x86_64' in probe or 'armv7' in probe or 'simulator' in probe:
                  failures.append(f'{name}: simulator/foreign slice ({arch_clean})')
              if '__DWARF' in otool:
                  failures.append(f'{name}: debug (DWARF) slice present')
              if b'SwiftShader' in open(path, 'rb').read():
                  failures.append(f'{name}: SwiftShader present')
              print(f'{name:<18} raw={raw:>9} stripped={stripped:>9} '
                    f'gzip={gz:>8} arch={arch_clean} '
                    f'16KiBAligned={"no" if misaligned else "yes"}')
          installed_ok = total_stripped <= 10 * mib
          gzip_ok = total_gzip <= 5 * mib
          print(f'TOTAL(ios-arm64) installed(stripped)={total_stripped} '
                f'({total_stripped / mib:.2f} MiB, budget 10.00 MiB -> '
                f'{"OK" if installed_ok else "EXCEEDED"})')
          print(f'TOTAL(ios-arm64) gzip={total_gzip} '
                f'({total_gzip / mib:.2f} MiB, budget 5.00 MiB -> '
                f'{"OK" if gzip_ok else "EXCEEDED"})')
          for f in failures:
              print(f'::error::{f}')
          if failures:
              sys.exit(1)
          # Size budget: issue #7 allows exceeding the budget with an explicit
          # documented size review before merge (docs/angle_1b.md, iOS host
          # section); the report records the measured values verbatim.
          print('SIZE-IOS-1 structural checks: OK (arm64 device slice only, '
                '16 KiB aligned, no simulator/debug/SwiftShader slices)')
          print('== ANGLE ios-arm64 size report: done ==')
          PY

      - name: Build the example for the simulator (plugin + app compile check)
        run: |
          cd example
          flutter pub get
          flutter build ios --simulator --debug

      - name: Build the example for the device (embed phase proof)
        run: |
          cd example
          flutter build ios --release --no-codesign

      - name: Simulator attempt of the e2e_ios device suite (bounded, recorded)
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## ANGLE iOS (F3b) — angle-ios job summary"
            echo '```'
            cat ios-size-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          UDID=$(xcrun simctl list devices available \
            | grep -m1 'iPhone' | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/' || true)
          if [ -z "${UDID:-}" ]; then
            RESULT="GPU suite not attempted: no available iPhone simulator runtime on the runner"
          else
            echo "Booting simulator $UDID (15-minute boot bound)"
            xcrun simctl boot "$UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$UDID" -b & BOOT_PID=$!
            ( sleep 900; kill "$BOOT_PID" 2>/dev/null ) & WATCHDOG=$!
            if wait "$BOOT_PID"; then BOOT_OK=1; else BOOT_OK=0; fi
            kill "$WATCHDOG" 2>/dev/null || true
            if [ "${BOOT_OK:-0}" != "1" ]; then
              RESULT="GPU suite not attempted: simulator boot exceeded the 15-minute bound"
            else
              if command -v timeout >/dev/null 2>&1; then BOUND=timeout; else BOUND=gtimeout; fi
              cd example
              set +e
              "$BOUND" 900 flutter test ../test/angle1b/e2e_ios_scene_test.dart -d "$UDID" \
                > ../simulator-attempt.log 2>&1
              TEST_RC=$?
              set -e
              cd ..
              if grep -q 'ANGLE_1B_UNAVAILABLE:' simulator-attempt.log; then
                REASON=$(grep -m1 'ANGLE_1B_UNAVAILABLE:' simulator-attempt.log | cut -d' ' -f2-)
                RESULT="GPU backend unavailable on the simulator (recorded): $REASON"
              elif [ "$TEST_RC" -eq 0 ]; then
                RESULT="e2e_ios device suite PASSED on the simulator"
              else
                RESULT="e2e_ios device suite FAILED on the simulator (exit $TEST_RC, see artifact angle-ios-simulator-attempt)"
              fi
            fi
            xcrun simctl shutdown "$UDID" 2>/dev/null || true
          fi
          echo "SIMULATOR ATTEMPT: $RESULT" | tee -a simulator-attempt-summary.txt
          {
            echo "### Simulator attempt (bounded, recorded)"
            echo "$RESULT"
            echo
            echo "The simulator build never embeds the device-slice ANGLE dylibs"
            echo "(its own build output, separate directory, never shipped); a"
            echo "recorded unavailability keeps the job green per plan §9."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload size report and simulator attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angle-ios-size-and-simulator-attempt
          path: |
            ios-size-report.txt
            simulator-attempt-summary.txt
            simulator-attempt.log
