name: PR Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Install dependencies
        run: flutter pub get

      - name: Build QuickJS bridge
        run: |
          set -euo pipefail
          QUICKJS_SRC=$(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 1 -type d -name 'quickjs_runtime-*' | sort -V | tail -1)
          test -n "$QUICKJS_SRC"
          bash "$QUICKJS_SRC/tool/build_quickjs.sh"
          mkdir -p native/quickjs
          cp "$QUICKJS_SRC/native/quickjs/libquickjs_bridge.so" native/quickjs/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify pinned THREE bundles and official example
        run: |
          set -euo pipefail
          THREE_COMMIT=$(python3 -c "import json; print(json.load(open('tool/three/source-pin.json'))['commit'])")
          git clone --filter=blob:none --no-checkout https://github.com/mrdoob/three.js.git /tmp/jsr-three-r186
          git -C /tmp/jsr-three-r186 checkout "$THREE_COMMIT"
          npm ci --prefix tool/three
          node tool/three/build.mjs --source /tmp/jsr-three-r186 --verify
          npm --prefix tool/three test
          dart run bin/jsr_three_example.dart prepare webgl_geometry_minecraft --source /tmp/jsr-three-r186 --offline --verify
          node tool/three_example/test/prepare_test.mjs

      - name: Run tests with coverage
        run: flutter test --coverage --no-pub

      - name: Run real-Worker WebGL2 tests
        run: flutter test --platform chrome test/web_three_host_web_test.dart --no-pub

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Exclude platform-specific code from coverage
        run: |
          lcov --remove coverage/lcov.info \
            'lib/src/flame_3d_vendor/**' \
            'lib/src/runtime/js_widget_engine_flutter_js.dart' \
            'lib/src/runtime/js_widget_engine_web_worker.dart' \
            'lib/src/widgets/js_widget_app.dart' \
            'lib/src/widgets/js_widget_demo_menu.dart' \
            'lib/src/widgets/js_widget_runtime_widget.dart' \
            --ignore-errors unused --ignore-errors empty \
            -o coverage/lcov.info

      - name: File size guard
        env:
          MAX_LINES: '1500'
        run: |
          set -euo pipefail
          VIOLATIONS=()
          while IFS= read -r file; do
            case "$file" in
              *.dart)
                case "$file" in
                  *.g.dart|*.freezed.dart|*.mocks.dart) continue ;;
                esac
                lines=$(wc -l < "$file")
                if (( lines > MAX_LINES )); then
                  VIOLATIONS+=("  $file: $lines lines (max $MAX_LINES)")
                fi
                ;;
            esac
          done < <(find lib test -type f)
          if ((${#VIOLATIONS[@]} > 0)); then
            echo "❌ QUALITY GATE FAILED — FILE SIZE"
            printf '%s\n' "${VIOLATIONS[@]}"
            exit 1
          fi
          echo "✅ File size guard OK (max $MAX_LINES lines)"

      - name: Code duplication guard
        env:
          DUP_THRESHOLD: '1.0'
        run: |
          set -euo pipefail
          npm install -g jscpd@5.4.2 >/dev/null 2>&1 || true
          jscpd --config .jscpd.json --min-tokens 50 --min-lines 5 --reporters json --output /tmp/jscpd-ci lib/ test/ >/dev/null 2>&1 || true
          DUP_PCT=$(python3 scripts/compute_duplication.py /tmp/jscpd-ci/jscpd-report.json)
          if python3 -c "exit(0 if float('$DUP_PCT') < float('$DUP_THRESHOLD') else 1)"; then
            echo "✅ Duplication check OK ($DUP_PCT% < ${DUP_THRESHOLD}%)"
          else
            echo "❌ QUALITY GATE FAILED — CODE DUPLICATION"
            echo "   Duplication: $DUP_PCT% (max ${DUP_THRESHOLD}%)"
            exit 1
          fi

      - name: Coverage ratchet
        env:
          COVERAGE_BASELINE: '80.0'
          COVERAGE_TARGET: '80.0'
        run: |
          set -euo pipefail
          COVERAGE_PCT=$(python3 scripts/compute_coverage.py coverage/lcov.info)
          if python3 -c "exit(0 if float('$COVERAGE_PCT') >= float('$COVERAGE_BASELINE') else 1)"; then
            echo "✅ Coverage ratchet OK ($COVERAGE_PCT% >= ${COVERAGE_BASELINE}%)"
            if python3 -c "exit(0 if float('$COVERAGE_PCT') >= float('$COVERAGE_TARGET') else 1)"; then
              echo "🏆 Coverage target ${COVERAGE_TARGET}% reached — excellent!"
            else
              echo "🎯 Coverage target: ${COVERAGE_TARGET}% (current: $COVERAGE_PCT%)"
            fi
          else
            echo "❌ QUALITY GATE FAILED — TEST COVERAGE"
            echo "   Coverage: $COVERAGE_PCT% (baseline ${COVERAGE_BASELINE}%)"
            exit 1
          fi

      - name: Install crap4dart
        run: dart pub global activate crap4dart '>=0.30.0 <0.31.0'

      - name: CRAP ratchet
        run: crap4dart analyze

      - name: Similarity gate
        run: crap4dart check --only similarity --config crap4dart.yaml

  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Install dependencies
        run: flutter pub get

      - name: Build QuickJS bridge
        run: |
          set -euo pipefail
          QUICKJS_SRC=$(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 1 -type d -name 'quickjs_runtime-*' | sort -V | tail -1)
          test -n "$QUICKJS_SRC"
          bash "$QUICKJS_SRC/tool/build_quickjs.sh"
          mkdir -p native/quickjs
          cp "$QUICKJS_SRC/native/quickjs/libquickjs_bridge.so" native/quickjs/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch conformance pins
        run: |
          set -euo pipefail
          scripts/fetch-conformance.sh
          test -f .conformance/js_widget_runtime/docs/conformance/PROTOCOL.md
          test -f .conformance/js_widget_runtime/harness/harness.mjs

      - name: Run conformance kit
        run: dart run tool/conformance/run_conformance.dart --fixtures .conformance/js_widget_runtime/docs/conformance/fixtures --out build/conformance

      # The pinned harness compare exits 0 even with zero result files
      # (kit-side defect, fixed in wave D), so the count is checked here.
      - name: Verify result count
        run: |
          set -euo pipefail
          expected=$(find .conformance/js_widget_runtime/docs/conformance/fixtures -mindepth 1 -maxdepth 1 -type d -exec test -f {}/expected.json ';' -print | wc -l)
          actual=$(find build/conformance -name '*.result.json' | wc -l)
          echo "conformance: $actual result files for $expected fixtures"
          if [ "$actual" -lt "$expected" ]; then
            echo "::error::missing conformance results ($actual/$expected)"
            exit 1
          fi

      - name: Compare against the contract
        run: node .conformance/js_widget_runtime/harness/harness.mjs compare --fixtures .conformance/js_widget_runtime/docs/conformance/fixtures --results build/conformance --out-report conformance-report.md --out-badge badges/conformance.json

      - name: Upload conformance results
        uses: actions/upload-artifact@v4
        with:
          name: conformance-flutter
          path: build/conformance/*.result.json

      - name: Upload conformance report
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: |
            conformance-report.md
            badges/conformance.json

  quality-macos:
    # Issue #7 (F2): the pinned ANGLE 1B build on macOS + the real-ANGLE
    # host tests. The ANGLE dylibs are cached on the pin hash; the first
    # build is long, later runs restore the cache.
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Install dependencies
        run: flutter pub get

      - name: Build QuickJS bridge
        run: |
          set -euo pipefail
          QUICKJS_SRC=$(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 1 -type d -name 'quickjs_runtime-*' | sort -V | tail -1)
          test -n "$QUICKJS_SRC"
          bash "$QUICKJS_SRC/tool/build_quickjs.sh"
          mkdir -p native/quickjs
          cp "$QUICKJS_SRC/native/quickjs/libquickjs_bridge.so" native/quickjs/

      - name: Metal toolchain
        run: |
          # macos-15 images ship Xcode 16 with the Metal toolchain embedded;
          # the download only runs when the compiler is actually missing
          # (same gate as tool/build_angle.sh).
          if xcrun -f metal >/dev/null 2>&1; then
            echo "Metal toolchain already present"
          else
            xcodebuild -downloadComponent metalToolchain
          fi

      - name: Restore pinned ANGLE build
        id: angle-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/jsr_three_angle/native/angle/out/macos-arm64
          key: angle-macos-arm64-${{ hashFiles('tool/three/pins/angle_pin.json') }}

      - name: Build pinned ANGLE (macos-arm64)
        if: steps.angle-cache.outputs.cache-hit != 'true'
        run: bash tool/build_angle.sh --platform macos-arm64 --out packages/jsr_three_angle/native/angle/out/macos-arm64

      # Save immediately after the build (not in a job-end post step):
      # a failing test step must not throw the ~50-minute ANGLE build away.
      # continue-on-error guards the race with a parallel run saving the
      # same key.
      - name: Save pinned ANGLE build
        if: steps.angle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: packages/jsr_three_angle/native/angle/out/macos-arm64
          key: angle-macos-arm64-${{ hashFiles('tool/three/pins/angle_pin.json') }}

      - name: Build the 1B shim and stage it with the ANGLE dylibs
        run: |
          set -euo pipefail
          OUT=packages/jsr_three_angle/native/angle/out/macos-arm64
          bash packages/jsr_three_angle/native/angle/build.sh
          cp packages/jsr_three_angle/native/angle/libangle_1b.dylib "$OUT/"
          (cd "$OUT" && shasum -a 256 libEGL.dylib libGLESv2.dylib libangle_1b.dylib > SHA256SUMS)

      # The dylibs are the deliverable of BUILD-ANGLE-1: upload them before
      # the tests so a test failure still leaves the artifact for download.
      - name: Upload ANGLE macos-arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: angle-macos-arm64
          path: |
            packages/jsr_three_angle/native/angle/out/macos-arm64/libEGL.dylib
            packages/jsr_three_angle/native/angle/out/macos-arm64/libGLESv2.dylib
            packages/jsr_three_angle/native/angle/out/macos-arm64/libangle_1b.dylib
            packages/jsr_three_angle/native/angle/out/macos-arm64/SHA256SUMS

      - name: jsr_three_angle host tests (real ANGLE)
        env:
          JSR_ANGLE_1B_LIB: ${{ github.workspace }}/packages/jsr_three_angle/native/angle/out/macos-arm64/libangle_1b.dylib
          JSR_REQUIRE_ANGLE: '1'
        run: flutter test packages/jsr_three_angle/test --no-pub

      - name: 1B selection and policy tests
        run: flutter test test/angle1b --no-pub

      - name: 1B batch bench (PERF-1 PERF-2)
        env:
          JSR_ANGLE_1B_LIB: ${{ github.workspace }}/packages/jsr_three_angle/native/angle/out/macos-arm64/libangle_1b.dylib
        run: dart run tool/three/bench_1b.dart

      - name: M3 render gate (compare_1b_render.sh)
        run: bash tool/three/compare_1b_render.sh

      - name: Starter corpus (E2E-EXAMPLES REG-VISUAL-1 E2E-WEB)
        run: bash tool/three/corpus_1b.sh

  angle-size:
    # Issue #7 AC10 size report for every platform built so far. F2d covers
    # macos-arm64 (stripped size, architectures, SHA256 from the
    # quality-macos artifact); the Android/iOS reports and the installed /
    # compressed budget gates land with the F3 platform hosts.
    needs: quality-macos
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ANGLE macos-arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: angle-macos-arm64
          path: angle-artifact

      - name: Size report (macos-arm64)
        run: |
          set -euo pipefail
          cd angle-artifact
          echo "== ANGLE macos-arm64 size report =="
          total_raw=0; total_stripped=0
          for f in libEGL.dylib libGLESv2.dylib libangle_1b.dylib; do
            test -f "$f"
            cp "$f" /tmp/jsr-strip.dylib
            before=$(stat -f %z "$f"); total_raw=$((total_raw+before))
            strip -x /tmp/jsr-strip.dylib
            after=$(stat -f %z /tmp/jsr-strip.dylib); total_stripped=$((total_stripped+after))
            archs=$(lipo -info "$f" | sed -e 's/Architectures in the fat file: //' -e 's/Architectures in this file: //')
            sha=$(shasum -a 256 "$f" | cut -d' ' -f1)
            printf '%-18s raw=%8d stripped=%8d arch=%-10s sha256=%s\n' "$f" "$before" "$after" "$archs" "$sha"
          done
          echo "TOTAL(macos-arm64) raw=$total_raw stripped=$total_stripped"
          # artifact integrity: the hashes recorded by the build job
          shasum -a 256 -c SHA256SUMS
          echo "== ANGLE macos-arm64 size report: OK =="

  # ==========================================================================
  # F3a Android (issue #7, AC3 + AC10): the pinned ANGLE Vulkan builds for
  # the three Android ABIs (matrix, cached by pin hash + ABI), the example
  # debug APK with 1B staged, the SIZE-ANDROID-1 report, and one bounded,
  # recorded emulator attempt of the device suite (REG-NOWEBVIEW-1 evidence
  # or the recorded reason why the GPU backend is unavailable there).
  # ==========================================================================
  angle-android:
    strategy:
      fail-fast: false
      matrix:
        abi: [android-arm64, android-armv7, android-x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore pinned ANGLE build (${{ matrix.abi }})
        id: angle-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/jsr_three_angle/native/angle/out/${{ matrix.abi }}
          key: angle-${{ matrix.abi }}-${{ hashFiles('tool/three/pins/angle_pin.json') }}

      - name: Build pinned ANGLE (${{ matrix.abi }}) + the libangle_1b.so shim
        if: steps.angle-cache.outputs.cache-hit != 'true'
        run: bash tool/build_angle.sh --platform ${{ matrix.abi }} --out packages/jsr_three_angle/native/angle/out/${{ matrix.abi }}

      # Always rebuild the shim from the committed sources — also on a cache
      # hit — so the staged artifact follows tool/build_angle.sh (link flags,
      # NDK) and never a stale cached shim. The cache below therefore stores
      # the fresh shim too.
      - name: Rebuild the libangle_1b.so shim (also on cache hits)
        run: bash tool/build_angle.sh --platform ${{ matrix.abi }} --shim-only --out packages/jsr_three_angle/native/angle/out/${{ matrix.abi }}

      # Saved immediately after the build (not in a job-end post step), same
      # rationale as the quality-macos job: a later failure must not throw
      # the ANGLE build away. continue-on-error guards the save race.
      - name: Save pinned ANGLE build
        if: steps.angle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: packages/jsr_three_angle/native/angle/out/${{ matrix.abi }}
          key: angle-${{ matrix.abi }}-${{ hashFiles('tool/three/pins/angle_pin.json') }}

      - name: Upload ANGLE ${{ matrix.abi }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: angle-${{ matrix.abi }}
          path: |
            packages/jsr_three_angle/native/angle/out/${{ matrix.abi }}/libEGL_angle.so
            packages/jsr_three_angle/native/angle/out/${{ matrix.abi }}/libGLESv2_angle.so
            packages/jsr_three_angle/native/angle/out/${{ matrix.abi }}/libangle_1b.so
            packages/jsr_three_angle/native/angle/out/${{ matrix.abi }}/SHA256SUMS

  angle-android-apk:
    needs: angle-android
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Download the ANGLE Android artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: angle-android-*
          path: angle-artifacts
          merge-multiple: false

      - name: Layout the artifacts under the out dirs
        run: |
          set -euo pipefail
          for abi in android-arm64 android-armv7 android-x86_64; do
            mkdir -p "packages/jsr_three_angle/native/angle/out/$abi"
            cp -a "angle-artifacts/angle-$abi/." "packages/jsr_three_angle/native/angle/out/$abi/"
          done
          ls -la packages/jsr_three_angle/native/angle/out/*

      - name: Verify artifact integrity and stage the example jniLibs
        run: |
          set -euo pipefail
          for abi in android-arm64 android-armv7 android-x86_64; do
            # shasum-formatted lines; sha256sum -c verifies the same format.
            (cd "packages/jsr_three_angle/native/angle/out/$abi" &&
              shasum -a 256 -c SHA256SUMS 2>/dev/null || sha256sum -c SHA256SUMS)
          done
          bash tool/stage_angle_android.sh

      - name: Build the example debug APK with 1B
        run: |
          cd example
          flutter pub get
          # quickjs_runtime's hook still links -lpthread on Android (bionic
          # has no libpthread) — patch the RESOLVED pub-cache copy (must run
          # after pub get; the script is CWD-independent).
          bash ../tool/patch_quickjs_android.sh
          # The native-assets hook compiles quickjs C code for Android and
          # needs an NDK: use the preinstalled 27.2.12479018 when present,
          # install it when not (deterministic either way).
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          [ -d "$ANDROID_NDK_HOME" ] || sdkmanager "ndk;27.2.12479018" >/dev/null
          flutter build apk --debug

      - name: SIZE-ANDROID-1 report
        run: bash tool/angle_size_android.sh --verify | tee angle-android-size.txt

      - name: Upload APK and size report
        uses: actions/upload-artifact@v4
        with:
          name: angle-android-apk
          path: |
            example/build/app/outputs/flutter-apk/app-debug.apk
            angle-android-size.txt

      - name: Emulator attempt (API 30 x86_64, TCG — bounded, recorded)
        run: |
          set -uo pipefail
          OUT=e2e-android
          mkdir -p "$OUT"
          {
            echo "## angle-android emulator attempt (API 30 x86_64, no KVM: TCG)"
            echo "recorded $(date -u +%Y-%m-%dT%H:%M:%SZ); bounded boot (20 min) + bounded suite (20 min)"
          } | tee "$OUT/summary.txt"

          sdkmanager "system-images;android-30;default;x86_64" "platform-tools" >/dev/null
          avdmanager create avd -n f3a -k "system-images;android-30;default;x86_64" -d pixel_5 --force >/dev/null

          # GH runner images preinstall the SDK but do not reliably put the
          # emulator and adb on PATH.
          EMU="$ANDROID_HOME/emulator/emulator"
          [ -x "$EMU" ] || EMU="$(command -v emulator || true)"
          ADB="$ANDROID_HOME/platform-tools/adb"
          [ -x "$ADB" ] || ADB="$(command -v adb || true)"
          export EMU ADB

          timeout 1200 bash -c '
            "$EMU" -avd f3a -no-window -no-audio -gpu swiftshader_indirect \
              -no-boot-anim -no-snapshot -accel off &
            "$ADB" wait-for-device
            for i in $(seq 1 240); do
              [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ] && exit 0
              sleep 5
            done
            exit 124
          ' > "$OUT/boot.txt" 2>&1
          boot_rc=$?
          pkill -f 'avd f3a' 2>/dev/null || true

          if [ "$boot_rc" -ne 0 ]; then
            echo "RESULT: EMULATOR BOOT FAILED within the 20-minute TCG bound (rc=$boot_rc)" | tee -a "$OUT/summary.txt"
            tail -10 "$OUT/boot.txt" | tee -a "$OUT/summary.txt" || true
            exit 0
          fi
          echo "RESULT: emulator booted" | tee -a "$OUT/summary.txt"

          cd example
          timeout 1200 flutter test ../test/angle1b/e2e_android_1b_test.dart \
            -d emulator-5554 > ../e2e-android-log.txt 2>&1
          suite_rc=$?
          cd ..

          {
            echo "suite exit code: $suite_rc"
            echo '```'
            grep -E "E2E-ANDROID|ANGLE 1B probe failed|requires API" e2e-android-log.txt || true
            tail -20 e2e-android-log.txt
            echo '```'
          } | tee -a "$OUT/summary.txt"
          cp e2e-android-log.txt "$OUT/test-log.txt"

          if [ "$suite_rc" -ne 0 ]; then
            echo "::warning::the device suite failed on the emulator — recorded above; the ANGLE GPU backend may be unavailable under TCG (the plan records the reason, it does not gate)"
          fi
          exit 0

      - name: Upload emulator attempt
        uses: actions/upload-artifact@v4
        with:
          name: angle-android-emulator
          path: |
            e2e-android/summary.txt
            e2e-android/boot.txt
            e2e-android/test-log.txt
