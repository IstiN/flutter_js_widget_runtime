name: Publish to pub.dev

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

# Serialize publish runs: the bump step commits to main, and parallel runs
# race on the git push (non-fast-forward) and burn version tags.
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[pub bump]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Install dependencies
        run: flutter pub get

      - name: Build QuickJS bridge
        run: |
          set -euo pipefail
          QUICKJS_SRC=$(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 1 -type d -name 'quickjs_runtime-*' | sort -V | tail -1)
          test -n "$QUICKJS_SRC"
          bash "$QUICKJS_SRC/tool/build_quickjs.sh"
          mkdir -p native/quickjs
          cp "$QUICKJS_SRC/native/quickjs/libquickjs_bridge.so" native/quickjs/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify pinned THREE bundles and official example
        run: |
          set -euo pipefail
          THREE_COMMIT=$(python3 -c "import json; print(json.load(open('tool/three/source-pin.json'))['commit'])")
          git clone --filter=blob:none --no-checkout https://github.com/mrdoob/three.js.git /tmp/jsr-three-r186
          git -C /tmp/jsr-three-r186 checkout "$THREE_COMMIT"
          npm ci --prefix tool/three
          node tool/three/build.mjs --source /tmp/jsr-three-r186 --verify
          npm --prefix tool/three test
          dart run bin/jsr_three_example.dart prepare webgl_geometry_minecraft --source /tmp/jsr-three-r186 --offline --verify
          node tool/three_example/test/prepare_test.mjs

      - name: Run tests
        run: flutter test --no-pub

      - name: Run real-Worker WebGL2 tests
        run: flutter test --platform chrome test/web_three_host_web_test.dart --no-pub

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version if tag already exists
        id: bump
        run: |
          set -e
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/^version: //')
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists. Bumping patch version..."
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
            sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
            {
              echo "## $NEW_VERSION"
              echo ""
              echo "- Automated patch bump."
              echo ""
              cat CHANGELOG.md
            } > CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md
            git add pubspec.yaml CHANGELOG.md
            git commit -m "chore: bump version to $NEW_VERSION [pub bump]"
            # Retry with rebase: a concurrent push to main (e.g. an automerge
            # or another publish run) may have moved the ref meanwhile.
            git push origin main || {
              git pull --rebase origin main
              git push origin main
            }
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Create version tag
        run: |
          VERSION=${{ steps.bump.outputs.version }}
          TAG="v$VERSION"
          git tag "$TAG"
          git push origin "$TAG"

      # example/ holds 325 prepared widget dirs (~1 GB raw; the prepared
      # widgets embed the THREE bundles) and would push the archive far past
      # pub.dev's 100 MB cap. packages/ is the optional jsr_three_angle
      # distribution (ADR-0002): applications that select 1B add it as its
      # own dependency; it must not ship inside js_widget_runtime. The 1B-only
      # test files that import it are excluded as well (their complete
      # reverse-import closure under test/). Stage a
      # publish dir from the tracked tree (git archive = same file set
      # `dart publish` selects, minus .gitignored build output) with
      # example/ and packages/ removed.
      - name: Stage package without example/, packages/ and 1B tests
        run: |
          set -euo pipefail
          STAGING="${RUNNER_TEMP}/jsr-publish-package"
          rm -rf "$STAGING" && mkdir -p "$STAGING"
          git archive HEAD -- ':!example' ':!packages' ':!test/angle1b' \
            ':!test/support/three_1b_engine.dart' ':!test/support/three_1b_real_wire.dart' \
            ':!test/support/f4c1_widget_helper.dart' ':!test/support/f4eg_cinematic.dart' \
            ':!test/support/f4i_host_proof_harness.dart' | tar -x -C "$STAGING"
          test ! -e "$STAGING/example"
          test ! -e "$STAGING/packages"
          test ! -e "$STAGING/test/angle1b"
          # Symlinks into example/ now dangle (e.g. test/assets/three_minecraft_widget.js)
          # and `dart pub publish` refuses to resolve them; drop any that no longer point
          # at a file inside the staging tree.
          find "$STAGING" -type l ! -exec test -e {} \; -delete
          # The dev-only jsr_three_angle path dependency points into packages/,
          # which ADR-0002 never ships inside js_widget_runtime: the staged
          # tree has no packages/, so the dependency must leave the staged
          # pubspec.yaml (and its pubspec.lock entry) or `dart pub publish`
          # fails to resolve the staged package. The 1B-only test files are
          # archived out above for the same reason — they are the complete
          # reverse-import closure of jsr_three_angle/ffi under test/, so no
          # remaining file references them.
          sed -i '/^  # Dev-only: lets `flutter test packages\/jsr_three_angle\/test`/,/^    path: packages\/jsr_three_angle$/d' "$STAGING/pubspec.yaml"
          sed -i '/^  jsr_three_angle:$/,/^    version: /d' "$STAGING/pubspec.lock"
          ! grep -q jsr_three_angle "$STAGING/pubspec.yaml"
          ! grep -q jsr_three_angle "$STAGING/pubspec.lock"
          echo "STAGING_DIR=$STAGING" >> "$GITHUB_ENV"

      - name: Publish to pub.dev
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          mkdir -p ~/.config/dart
          echo "$PUB_CREDENTIALS" | base64 -d > ~/.config/dart/pub-credentials.json
          dart pub publish --force --directory "$STAGING_DIR"
