name: Publish to pub.dev

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

# Serialize publish runs: the bump step commits to main, and parallel runs
# race on the git push (non-fast-forward) and burn version tags.
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[pub bump]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned: hosted flame_3d 0.3.0 does not compile against the
          # flutter_gpu API shipped with Flutter 3.47+. The Flutter 3.47
          # compatible build lives on the flame-3.47 branch (IstiN/flame
          # fork). Unpin when flame-engine/flame#3995 is published.
          channel: stable
          flutter-version: 3.44.4

      - name: Install dependencies
        run: flutter pub get

      - name: Install gcc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc

      - name: Build QuickJS native library
        run: |
          QUICKJS_DIR=$(python3 -c "
          import json
          cfg = json.load(open('.dart_tool/package_config.json'))
          for p in cfg['packages']:
              if p['name'] == 'quickjs_runtime':
                  print(p['rootUri'].replace('file://','')); break
          ")
          echo "quickjs_runtime at: $QUICKJS_DIR"
          bash "$QUICKJS_DIR/tool/build_quickjs.sh"

      - name: Run tests
        run: flutter test --no-pub

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version if tag already exists
        id: bump
        run: |
          set -e
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/^version: //')
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists. Bumping patch version..."
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
            sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
            {
              echo "## $NEW_VERSION"
              echo ""
              echo "- Automated patch bump."
              echo ""
              cat CHANGELOG.md
            } > CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md
            git add pubspec.yaml CHANGELOG.md
            git commit -m "chore: bump version to $NEW_VERSION [pub bump]"
            # Retry with rebase: a concurrent push to main (e.g. an automerge
            # or another publish run) may have moved the ref meanwhile.
            git push origin main || {
              git pull --rebase origin main
              git push origin main
            }
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Create version tag
        run: |
          VERSION=${{ steps.bump.outputs.version }}
          TAG="v$VERSION"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Publish to pub.dev
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          mkdir -p ~/.config/dart
          echo "$PUB_CREDENTIALS" | base64 -d > ~/.config/dart/pub-credentials.json
          flutter pub publish --force
