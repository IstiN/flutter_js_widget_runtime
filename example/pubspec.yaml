name: js_widget_runtime_example
description: Example app demonstrating js_widget_runtime.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter

  flutter_inappwebview: ^6.1.5
  js_widget_runtime:
    path: ../

  # Web preview runner (lib/preview.dart): fetch + document.title.
  video_player: ^2.14.0
  web: ^1.1.1

dev_dependencies:
