name: js_widget_runtime_example
description: Example app demonstrating js_widget_runtime.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  js_widget_runtime:
    path: ../

  # Web preview runner (lib/preview.dart): fetch + document.title.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - widgets/yolo-hello/
    - widgets/calculator/
    - widgets/animation-showcase/
    - widgets/weather/
    - widgets/stocks/
    - widgets/crypto/
    - widgets/3d-viewer/
    - widgets/3d-showcase/
    - widgets/3d-glb-showcase/
    - widgets/3d-game-dodge/
    - widgets/fitness-trainer/
    - widgets/m3-showcase/
    - widgets/pomodoro/
    - widgets/charts-showcase/
    - widgets/map/
    - assets/models/
