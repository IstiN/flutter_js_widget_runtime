name: js_widget_runtime_example
description: Example app demonstrating js_widget_runtime.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter

  flutter_inappwebview: ^6.1.5
  js_widget_runtime:
    path: ../

  # Web preview runner (lib/preview.dart): fetch + document.title.
  video_player: ^2.14.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - widgets/yolo-hello/
    - widgets/calculator/
    - widgets/animation-showcase/
    - widgets/weather/
    - widgets/stocks/
    - widgets/crypto/
    - widgets/3d-viewer/
    - widgets/3d-showcase/
    - widgets/3d-glb-showcase/
    - widgets/3d-game-dodge/
    - widgets/fitness-trainer/
    - widgets/m3-showcase/
    - widgets/pomodoro/
    - widgets/audio-player/
    - widgets/video-player/
    - widgets/webview-showcase/
    - widgets/adaptive-dashboard/
    - widgets/charts-showcase/
    - widgets/map/
    - widgets/three-minecraft/
    - widgets/three-geometry-colors/
    - widgets/three-lines-colors/
    - widgets/three-buffergeometry-uint/
    - widgets/three-buffergeometry-indexed/
    - widgets/three-buffergeometry-lines-indexed/
    - widgets/three-buffergeometry-points/
    - widgets/three-geometry-terrain-raycast/
    - widgets/three-math-orientation-transform/
    - widgets/three-interactive-raycasting-points/
    - widgets/three-interactive-cubes/
    - widgets/three-interactive-cubes-ortho/
    - widgets/three-math-obb/
    - widgets/three-buffergeometry-points-interleaved/
    - widgets/three-interactive-voxelpainter/
    - widgets/three-panorama-equirectangular/
    - assets/models/
