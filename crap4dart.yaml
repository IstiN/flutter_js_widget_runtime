# crap4dart configuration.
# See https://github.com/IstiN/crap4dart for details.

sources: [lib, bin]
exclude:
  # Vendored third-party code (flame_3d, see lib/src/flame_3d_vendor/VENDOR.md)
  - 'lib/src/flame_3d_vendor/**'
  - 'example/**'
  - 'tool/**'
  - '**.g.dart'
  - '**.freezed.dart'
  - '**.mocks.dart'
  - 'lib/src/runtime/js_widget_engine_flutter_js.dart'
  - 'lib/src/runtime/js_widget_engine_web_worker.dart'
  - 'lib/src/widgets/js_widget_app.dart'
  - 'lib/src/widgets/js_widget_demo_menu.dart'
  - 'lib/src/widgets/js_widget_runtime_widget.dart'

crap:
  enabled: true
  # Current baseline (Max CRAP 12.00). Do not increase without explicit
  # approval; the goal is to ratchet this down over time.
  threshold: 12.0
  run_tests: false

coverage:
  lcov_path: coverage/lcov.info
  run_tests: false
  required: true
  branch_coverage: true

gates:
  # CRAP-only ratchet for now. Enable other gates only after the baseline
  # improves enough that they pass; otherwise every commit would fail.
  loc:
    enabled: false
  test_coverage:
    enabled: false
  golden:
    enabled: false
  hardcoded_strings:
    enabled: false
  accessibility:
    enabled: false
  complexity:
    enabled: false
  method_size:
    enabled: false
  public_docs:
    enabled: false

  # Files reached only through conditional imports (dart.library.io/html)
  # or from excluded platform files look "never imported" to the static
  # import graph — they are entry points for platform variants, not orphans.
  unused_files:
    enabled: true
    dirs: [lib]
    exclude:
      - '**.g.dart'
      - '**.freezed.dart'
      - '**.mocks.dart'
      - 'lib/src/defaults/web_default_handlers.dart'
      - 'lib/src/defaults/vm_default_handlers.dart'
      - 'lib/src/renderer/nodes/image_provider_resolver_io.dart'
      - 'lib/src/renderer/nodes/image_provider_resolver_web.dart'
      - 'lib/src/runtime/js_widget_engine_default_web.dart'
      - 'lib/src/runtime/js_widget_engine_message.dart'
      - 'lib/src/runtime/js_widget_engine_quickjs.dart'
      - 'lib/src/runtime/js_widget_bootstrap.dart'

  # Ratchet: do not add files here without team approval.
  duplication:
    enabled: true
    threshold: 1.0

  # Rendering code is numeric by nature (layout dims, chart metrics, color
  # values). Hex colors outside const declarations still get flagged.
  magic_constants:
    enabled: true
    flag_hex_colors: true
    min_duplicates: 3
    exclude:
      - '**.g.dart'
      - 'test/**'
      - 'lib/src/renderer/nodes/js_layout_nodes.dart'

  class_size:
    enabled: true
    # 30 methods: hosts/bridge legitimately coordinate many small handlers
    # (already split into part files and helper classes); WMC stays strict.
    max_methods: 30
    max_wmc: 80

  folder_structure:
    enabled: false
